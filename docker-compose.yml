# Отдельный compose-проект: не трогает другие боты на той же машине.
# Нет проброшенных портов — Telegram ходит наружу сам.
#
# На серверах со старым docker-compose (без ключа name:) запускать так:
#   docker-compose -p bidcarbot up -d --build
#
# DNS: у Timeweb UDP/53 до 8.8.8.8 часто закрыт — используем их резолверы.
# extra_hosts: IPv4-пины. На VPS DNS/getent часто показывает AAAA, а IPv6 мёртв
# → ClientConnectorDNSError / TelegramNetworkError timeout при «живом» контейнере.
# sysctls: режем IPv6 в неймспейсе контейнера, чтобы libc/curl брали IPv4 из hosts.
# IP устарели?  dig +short api.telegram.org A   /   dig +short bid.cars A
#   dig +short www.copart.com A   /   dig +short www.iaai.com A
version: "3.8"

services:
  bidcarbot:
    build: .
    image: bidcarbot:latest
    container_name: bidcarbot
    restart: unless-stopped
    dns:
      - 85.193.93.193
      - 85.193.93.194
      - 1.1.1.1
    extra_hosts:
      - "api.telegram.org:149.154.166.110"
      - "bid.cars:104.18.27.43"
      - "www.bid.cars:104.18.27.43"
      - "www.copart.com:45.60.13.242"
      - "copart.com:45.60.13.242"
      - "www.iaai.com:151.101.194.129"
      - "iaai.com:151.101.194.129"
      - "vis.iaai.com:151.101.194.129"
      - "cs.copart.com:104.20.44.240"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/bidcarbot.db
      LOG_DIR: /app/data/logs
    volumes:
      - bidcarbot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bidcarbot_data:
    name: bidcarbot_data
